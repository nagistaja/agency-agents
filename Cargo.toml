[package]
name = "pakk"
version = "0.1.0"
edition = "2021"
description = "Kiire ja tõhus mitmelõimeline pakkimistööriist — a fast, high-ratio multithreaded archiver"
license = "MIT"
repository = "https://github.com/nagistaja/pakk"
readme = "README.md"
keywords = ["compression", "archive", "zstd", "xz", "tar"]
categories = ["compression", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = { version = "0.1", features = ["static"] }
anyhow = "1"
num_cpus = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
